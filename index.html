<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagefine - Controle Financeiro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Pagefine - Controle Financeiro</h1>
      <p class="subtitle">Seu Painel de Finanças Pessoais</p>
    </header>

    <div class="dashboard-grid">
      <!-- Card do Formulário -->
      <div class="card">
        <h2>Adicionar Gasto</h2>
        <form id="finance-form">
          <div class="form-group">
            <label for="desc">Descrição / Local</label>
            <input type="text" id="desc" placeholder="Ex: Mercado, Combustível..." required>
          </div>
          <div class="form-group">
            <label for="amount">Valor (R$)</label>
            <input type="number" id="amount" step="0.01" placeholder="0,00" required>
          </div>
          <div class="form-group">
            <label for="category">Categoria</label>
            <select id="category">
              <option value="Alimentação">Alimentação</option>
              <option value="Transporte">Transporte</option>
              <option value="Lazer">Lazer</option>
              <option value="Moradia">Moradia</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date">Data</label>
            <input type="date" id="date" required>
          </div>
          <button type="submit">+ Salvar Gasto</button>
        </form>
      </div>

      <!-- Card do Resumo -->
      <div class="card summary-card">
        <div>
          <h2>Resumo do Mês</h2>
          <p class="subtitle">Total acumulado gasto no período</p>
          <div class="total-amount" id="total-month">R$ 0,00</div>
          <span class="budget-status">● Dentro do Planejado</span>
        </div>
      </div>
    </div>

    <!-- Card da Tabela de Histórico -->
    <div class="card">
      <h2>Histórico de Gastos</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody id="expense-list">
            <!-- Gerado via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
