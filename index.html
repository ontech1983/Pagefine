<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagefine - Controle Financeiro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Controle Financeiro</h1>
    
    <form id="finance-form">
      <div>
        <label for="desc">Local / Descrição:</label>
        <input type="text" id="desc" placeholder="Ex: Mercado" required>
      </div>
      <div>
        <label for="amount">Valor (R$):</label>
        <input type="number" id="amount" step="0.01" placeholder="Ex: 85.50" required>
      </div>
      <div>
        <label for="category">Categoria:</label>
        <select id="category">
          <option value="Alimentação">Alimentação</option>
          <option value="Transporte">Transporte</option>
          <option value="Lazer">Lazer</option>
          <option value="Moradia">Moradia</option>
          <option value="Outros">Outros</option>
        </select>
      </div>
      <div>
        <label for="date">Data:</label>
        <input type="date" id="date" required>
      </div>
      <button type="submit">Salvar Gasto</button>
    </form>

    <div class="summary">
      <h2>Resumo do Mês</h2>
      <p>Total Gasto: <strong id="total-month">R$ 0,00</strong></p>
    </div>

    <h2>Histórico de Gastos</h2>
    <table>
     <thead>
  <tr>
    <th>Data</th>
    <th>Descrição</th>
    <th>Categoria</th>
    <th>Valor</th>
    <th>Ações</th>
  </tr>
</thead>
  </div>

  <script src="script.js"></script>
</body>
</html>
